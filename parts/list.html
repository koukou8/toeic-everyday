<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>パート一覧 — まいにちTOEIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tw.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style> body{-webkit-font-smoothing:antialiased} .tnum{font-variant-numeric:tabular-nums} </style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans lg:pl-60">

<div class="mx-auto max-w-[440px] lg:max-w-[880px] min-h-screen px-5 pb-28 lg:pb-12 pt-7">

  <header class="flex items-center gap-3">
    <a href="../index.html" class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-[20px] font-bold tracking-tight">パート別対策</h1>
  </header>

  <p class="mt-3 text-[13px] text-sub leading-relaxed">英語が苦手なら、まずは <strong class="text-ink">Part 5</strong>（短文穴埋め）から。点が取りやすく、毎日の積み上げに向いています。</p>

  <section class="mt-5">
    <h2 class="mb-3 flex items-center gap-2 text-[13px] font-bold text-sky-600"><span class="h-2 w-2 rounded-full bg-sky-500"></span>リスニング (Part 1–4)</h2>
    <div class="grid gap-3 lg:grid-cols-2" id="listening"></div>
  </section>

  <section class="mt-6">
    <h2 class="mb-3 flex items-center gap-2 text-[13px] font-bold text-violet-600"><span class="h-2 w-2 rounded-full bg-violet-500"></span>リーディング (Part 5–7)</h2>
    <div class="grid gap-3 lg:grid-cols-2" id="reading"></div>
  </section>

</div>

<div id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="../assets/store.js?v=2"></script>
<script src="../assets/content.js?v=4"></script>
<script src="../assets/ui.js?v=3"></script>
<script src="../assets/firebase.js?v=2"></script>
<script src="../assets/sync.js?v=2"></script>
<script>
  function card(p) {
    const pr = Store.getPartProgress(p.id);
    const bankLen = PART_CONTENT[p.id]?.questions.length || 0;
    const total = pr.total || Math.min(PART_SESSION, bankLen);
    const pct = total ? Math.round((pr.completed / total) * 100) : 0;
    const isL = p.skill === 'L';
    const bar = isL ? 'bg-sky-500' : 'bg-violet-500';
    const chip = isL ? 'bg-sky-50 text-sky-600' : 'bg-violet-50 text-violet-600';
    const done = pct >= 100;
    return `<a href="part.html?p=${p.id}" class="flex items-center gap-4 rounded-2xl bg-white p-4 shadow-soft border border-line">
      <div class="grid h-12 w-12 shrink-0 place-items-center rounded-xl ${chip} font-num text-[18px] font-bold">${p.no}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <p class="text-[15px] font-bold truncate">Part ${p.no} ${p.title}</p>
          ${done ? '<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-bold text-emerald-600">達成</span>' : ''}
        </div>
        <p class="text-[12px] text-sub">${p.desc}</p>
        <div class="mt-2 flex items-center gap-2">
          <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-line">
            <div class="h-full rounded-full ${bar}" style="width:${pct}%"></div>
          </div>
          <span class="font-num text-[11px] font-semibold text-sub tnum">${pr.completed}/${total}</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>`;
  }

  function render() {
    document.getElementById('listening').innerHTML = PARTS.filter((p) => p.skill === 'L').map(card).join('');
    document.getElementById('reading').innerHTML = PARTS.filter((p) => p.skill === 'R').map(card).join('');
  }
  render();
  Store.onChange(render); // クラウド受信時に再描画
  document.getElementById('nav').innerHTML = UI.renderNav('parts', '../');
</script>
</body>
</html>
