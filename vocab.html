<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>単語帳 — まいにちTOEIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body{-webkit-font-smoothing:antialiased} .tnum{font-variant-numeric:tabular-nums}
  .card3d{perspective:1200px}
  .card-inner{transition:transform .5s;transform-style:preserve-3d;position:relative}
  .card-inner.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{transform:rotateY(180deg)}
</style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans lg:pl-60">

<div class="mx-auto max-w-[440px] lg:max-w-[560px] min-h-screen px-5 pb-28 lg:pb-12 pt-7">

  <header class="flex items-center gap-3">
    <a href="index.html" class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[12px] text-sub">タップでめくる</p>
      <h1 class="text-[20px] font-bold tracking-tight">単語・熟語帳</h1>
    </div>
    <span class="font-num text-[13px] font-semibold text-sub tnum" id="counter">0/0</span>
  </header>

  <!-- progress -->
  <div class="mt-4 h-1.5 w-full overflow-hidden rounded-full bg-line">
    <div class="h-full rounded-full bg-brand transition-all" id="bar" style="width:0%"></div>
  </div>

  <!-- card -->
  <div id="cardArea" class="mt-6">
    <div class="card3d">
      <div id="cardInner" class="card-inner h-[260px] cursor-pointer">
        <!-- front -->
        <div class="face rounded-3xl bg-white shadow-card border border-line grid place-items-center px-6">
          <div class="text-center">
            <p id="frontWord" class="font-num text-[34px] font-extrabold tracking-tight">word</p>
            <p class="mt-3 text-[12px] text-sub">タップして意味を見る</p>
          </div>
          <button id="speakFront" class="absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-full bg-indigo-50 text-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg>
          </button>
        </div>
        <!-- back -->
        <div class="face back rounded-3xl bg-gradient-to-br from-brand to-brand2 text-white shadow-card grid place-items-center px-6">
          <div class="text-center">
            <p id="backWord" class="font-num text-[22px] font-bold"></p>
            <p id="backJa" class="mt-2 text-[20px] font-bold"></p>
            <p id="backEx" class="mt-3 text-[13px] text-white/85 italic"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- actions -->
  <div id="actions" class="mt-6 grid grid-cols-2 gap-3">
    <button id="btnStill" class="rounded-2xl bg-white py-4 text-[14px] font-bold text-sub shadow-soft border border-line">まだ覚えてない</button>
    <button id="btnKnown" class="rounded-2xl bg-emerald-500 py-4 text-[14px] font-bold text-white shadow-card">覚えた ✓</button>
  </div>

  <!-- done -->
  <div id="doneBox" class="mt-6 hidden rounded-2xl bg-white p-6 text-center shadow-soft border border-line">
    <div class="text-[32px]">🎉</div>
    <p class="mt-1 text-[15px] font-bold">今日の単語、完了！</p>
    <p class="mt-1 text-[13px] text-sub" id="doneText"></p>
    <div class="mt-4 flex gap-3">
      <button id="againBtn" class="flex-1 rounded-2xl bg-indigo-50 py-3 text-[14px] font-bold text-brand">もう一度</button>
      <a href="index.html" class="flex-1 rounded-2xl bg-brand py-3 text-[14px] font-bold text-white">ホームへ</a>
    </div>
  </div>

</div>

<div id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/store.js?v=2"></script>
<script src="assets/content.js?v=3"></script>
<script src="assets/ui.js?v=2"></script>
<script src="assets/firebase.js?v=2"></script>
<script src="assets/sync.js?v=2"></script>
<script>
  const SESSION = 10; // 1回の学習枚数
  let deck = [];
  let idx = 0;
  let learned = 0;

  function buildDeck() {
    // 未習得を優先して10枚
    const unknown = VOCAB.filter((v) => !Store.isVocabKnown(v.en));
    const known = VOCAB.filter((v) => Store.isVocabKnown(v.en));
    deck = unknown.concat(known).slice(0, SESSION);
    idx = 0; learned = 0;
  }

  const inner = document.getElementById('cardInner');
  function showCard() {
    const v = deck[idx];
    inner.classList.remove('flipped');
    document.getElementById('frontWord').textContent = v.en;
    document.getElementById('backWord').textContent = v.en;
    document.getElementById('backJa').textContent = v.ja;
    document.getElementById('backEx').textContent = '"' + v.ex + '"';
    document.getElementById('counter').textContent = (idx + 1) + '/' + deck.length;
    document.getElementById('bar').style.width = ((idx) / deck.length * 100) + '%';
  }

  inner.addEventListener('click', (e) => {
    if (e.target.closest('#speakFront')) return;
    inner.classList.toggle('flipped');
  });
  document.getElementById('speakFront').addEventListener('click', (e) => {
    e.stopPropagation();
    UI.speak(deck[idx].en, { rate: 0.9 });
  });

  function next(markKnown) {
    const v = deck[idx];
    Store.markVocabKnown(v.en, markKnown);
    if (markKnown) learned++;
    idx++;
    if (idx >= deck.length) return finish();
    showCard();
  }
  document.getElementById('btnKnown').addEventListener('click', () => next(true));
  document.getElementById('btnStill').addEventListener('click', () => next(false));

  function finish() {
    Store.recordDone('vocab');
    document.getElementById('bar').style.width = '100%';
    document.getElementById('cardArea').classList.add('hidden');
    document.getElementById('actions').classList.add('hidden');
    document.getElementById('counter').textContent = deck.length + '/' + deck.length;
    document.getElementById('doneText').textContent =
      `${deck.length}語を学習。うち ${learned}語を「覚えた」に登録。連続 ${Store.getStreak()} 日！`;
    document.getElementById('doneBox').classList.remove('hidden');
    UI.celebrate();
  }

  document.getElementById('againBtn').addEventListener('click', () => {
    buildDeck();
    document.getElementById('cardArea').classList.remove('hidden');
    document.getElementById('actions').classList.remove('hidden');
    document.getElementById('doneBox').classList.add('hidden');
    showCard();
  });

  buildDeck();
  showCard();
  document.getElementById('nav').innerHTML = UI.renderNav('vocab');
</script>
</body>
</html>
