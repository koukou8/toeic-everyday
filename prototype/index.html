<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>まいにちTOEIC — デザイン試作</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Noto Sans JP"', '"Inter"', 'sans-serif'],
          num: ['"Inter"', 'sans-serif'],
        },
        colors: {
          ink: '#0F172A',
          sub: '#64748B',
          line: '#EAECEF',
          brand: '#4F46E5',
          brand2: '#6366F1',
        },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06)',
          soft: '0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05)',
        },
      },
    },
  };
</script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
</style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans">

<div class="mx-auto max-w-[440px] min-h-screen px-5 pb-28 pt-7">

  <!-- header -->
  <header class="flex items-center justify-between">
    <div>
      <p class="text-[13px] text-sub">おかえりなさい 👋</p>
      <h1 class="text-[22px] font-bold tracking-tight">まいにちTOEIC</h1>
    </div>
    <button class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M3.5 3.5l2 2M14.5 14.5l2 2M1 10h3M16 10h3M3.5 16.5l2-2M14.5 5.5l2-2"/></svg>
    </button>
  </header>

  <!-- hero: countdown + streak -->
  <section class="mt-6 overflow-hidden rounded-3xl bg-gradient-to-br from-brand to-brand2 p-6 text-white shadow-card relative">
    <div class="absolute -right-8 -top-10 h-40 w-40 rounded-full bg-white/10"></div>
    <div class="absolute -right-2 top-16 h-24 w-24 rounded-full bg-white/10"></div>
    <div class="relative flex items-end justify-between">
      <div>
        <p class="text-[12px] font-medium text-white/80">試験日まで</p>
        <div class="mt-1 flex items-baseline gap-1.5">
          <span class="font-num text-[52px] font-extrabold leading-none tnum">42</span>
          <span class="pb-1 text-[15px] font-medium text-white/85">日</span>
        </div>
        <p class="mt-1 text-[12px] text-white/70">2026年9月13日(日)</p>
      </div>
      <div class="rounded-2xl bg-white/15 px-4 py-3 text-center backdrop-blur-sm">
        <div class="text-[22px] leading-none">🔥</div>
        <div class="mt-1 font-num text-[20px] font-bold tnum">12</div>
        <div class="text-[10px] text-white/80">連続日数</div>
      </div>
    </div>
    <div class="relative mt-5">
      <div class="flex items-center justify-between text-[11px] text-white/80">
        <span>全体の進捗</span><span class="font-num font-semibold">55%</span>
      </div>
      <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-white/20">
        <div class="h-full w-[55%] rounded-full bg-white"></div>
      </div>
    </div>
  </section>

  <!-- today's task -->
  <section class="mt-6">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-[15px] font-bold">今日のタスク</h2>
      <span class="text-[12px] text-sub">残り 2 / 3</span>
    </div>
    <div class="rounded-2xl bg-white p-2 shadow-soft border border-line">
      <!-- done -->
      <div class="flex items-center gap-3 rounded-xl px-3 py-3">
        <div class="grid h-9 w-9 place-items-center rounded-full bg-emerald-500 text-white">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-[14px] font-medium text-sub line-through">単語帳 10語</p>
        </div>
        <span class="text-[12px] font-semibold text-emerald-600">完了</span>
      </div>
      <div class="mx-3 h-px bg-line"></div>
      <!-- next -->
      <div class="flex items-center gap-3 rounded-xl px-3 py-3">
        <div class="grid h-9 w-9 place-items-center rounded-full bg-indigo-50 text-brand font-num font-bold text-[13px]">5</div>
        <div class="flex-1">
          <p class="text-[14px] font-semibold">Part 5 短文穴埋め</p>
          <p class="text-[11px] text-sub">文法・語彙 / 5問</p>
        </div>
        <button class="rounded-full bg-brand px-4 py-2 text-[12px] font-bold text-white shadow-soft">はじめる</button>
      </div>
      <div class="mx-3 h-px bg-line"></div>
      <div class="flex items-center gap-3 rounded-xl px-3 py-3">
        <div class="grid h-9 w-9 place-items-center rounded-full bg-indigo-50 text-brand font-num font-bold text-[13px]">2</div>
        <div class="flex-1">
          <p class="text-[14px] font-semibold">Part 2 応答問題</p>
          <p class="text-[11px] text-sub">リスニング / 5問</p>
        </div>
        <button class="rounded-full bg-indigo-50 px-4 py-2 text-[12px] font-bold text-brand">はじめる</button>
      </div>
    </div>
  </section>

  <!-- parts grid -->
  <section class="mt-6">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-[15px] font-bold">パート別対策</h2>
      <button class="text-[12px] font-medium text-brand">すべて見る</button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <!-- card -->
      <a class="rounded-2xl bg-white p-4 shadow-soft border border-line">
        <div class="flex items-center justify-between">
          <span class="rounded-lg bg-sky-50 px-2 py-0.5 text-[10px] font-bold text-sky-600">L</span>
          <span class="font-num text-[11px] font-semibold text-sub tnum">3/5</span>
        </div>
        <p class="mt-3 text-[14px] font-bold">Part 1</p>
        <p class="text-[11px] text-sub">写真描写</p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-line">
          <div class="h-full w-[60%] rounded-full bg-sky-500"></div>
        </div>
      </a>
      <a class="rounded-2xl bg-white p-4 shadow-soft border border-line">
        <div class="flex items-center justify-between">
          <span class="rounded-lg bg-sky-50 px-2 py-0.5 text-[10px] font-bold text-sky-600">L</span>
          <span class="font-num text-[11px] font-semibold text-sub tnum">1/5</span>
        </div>
        <p class="mt-3 text-[14px] font-bold">Part 2</p>
        <p class="text-[11px] text-sub">応答問題</p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-line">
          <div class="h-full w-[20%] rounded-full bg-sky-500"></div>
        </div>
      </a>
      <a class="rounded-2xl bg-white p-4 shadow-soft border border-line">
        <div class="flex items-center justify-between">
          <span class="rounded-lg bg-violet-50 px-2 py-0.5 text-[10px] font-bold text-violet-600">R</span>
          <span class="font-num text-[11px] font-semibold text-sub tnum">3/5</span>
        </div>
        <p class="mt-3 text-[14px] font-bold">Part 5</p>
        <p class="text-[11px] text-sub">短文穴埋め</p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-line">
          <div class="h-full w-[60%] rounded-full bg-violet-500"></div>
        </div>
      </a>
      <a class="rounded-2xl bg-white p-4 shadow-soft border border-line">
        <div class="flex items-center justify-between">
          <span class="rounded-lg bg-violet-50 px-2 py-0.5 text-[10px] font-bold text-violet-600">R</span>
          <span class="font-num text-[11px] font-semibold text-sub tnum">0/5</span>
        </div>
        <p class="mt-3 text-[14px] font-bold">Part 7</p>
        <p class="text-[11px] text-sub">読解</p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-line">
          <div class="h-full w-[4%] rounded-full bg-violet-500"></div>
        </div>
      </a>
    </div>
  </section>

  <!-- score trend -->
  <section class="mt-6">
    <div class="rounded-2xl bg-white p-5 shadow-soft border border-line">
      <div class="flex items-center justify-between">
        <h2 class="text-[15px] font-bold">スコア推移</h2>
        <span class="rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-bold text-emerald-600">+45 ↑</span>
      </div>
      <div class="mt-4">
        <svg viewBox="0 0 320 110" class="w-full">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M0,86 C40,80 60,70 90,66 C130,60 150,52 190,40 C230,30 260,28 320,18 L320,110 L0,110 Z" fill="url(#g)"/>
          <path d="M0,86 C40,80 60,70 90,66 C130,60 150,52 190,40 C230,30 260,28 320,18" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="320" cy="18" r="4" fill="#4F46E5"/>
          <circle cx="320" cy="18" r="8" fill="#4F46E5" opacity="0.15"/>
        </svg>
      </div>
      <div class="mt-1 flex justify-between text-[10px] text-sub">
        <span>4月</span><span>5月</span><span>今</span>
      </div>
    </div>
  </section>

</div>

<!-- bottom nav -->
<nav class="fixed bottom-0 left-1/2 z-20 w-full max-w-[440px] -translate-x-1/2 border-t border-line bg-white/90 backdrop-blur-md">
  <div class="grid grid-cols-4 px-2 py-2">
    <button class="flex flex-col items-center gap-1 py-1 text-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2h-3v-6H8v6H5a2 2 0 0 1-2-2z"/></svg>
      <span class="text-[10px] font-semibold">ホーム</span>
    </button>
    <button class="flex flex-col items-center gap-1 py-1 text-sub">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span class="text-[10px]">パート</span>
    </button>
    <button class="flex flex-col items-center gap-1 py-1 text-sub">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span class="text-[10px]">単語</span>
    </button>
    <button class="flex flex-col items-center gap-1 py-1 text-sub">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg>
      <span class="text-[10px]">マイ</span>
    </button>
  </div>
</nav>

</body>
</html>
