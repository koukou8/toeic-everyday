<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1" />
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png?v=1" />
<meta name="apple-mobile-web-app-title" content="まいにちTOEIC" />
<title>まいにちTOEIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style> body{-webkit-font-smoothing:antialiased} .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"} </style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans lg:pl-60">

<div class="mx-auto max-w-[440px] lg:max-w-[920px] min-h-screen px-5 pb-28 lg:pb-12 pt-7">

  <header class="flex items-center justify-between">
    <div>
      <p class="text-[13px] text-sub">おかえりなさい 👋</p>
      <h1 class="text-[22px] font-bold tracking-tight">まいにちTOEIC</h1>
    </div>
    <a href="settings.html" class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M3.5 3.5l2 2M14.5 14.5l2 2M1 10h3M16 10h3M3.5 16.5l2-2M14.5 5.5l2-2"/></svg>
    </a>
  </header>

  <!-- hero + today (PCでは横並び) -->
  <div class="grid gap-6 lg:grid-cols-2 lg:items-start">

  <!-- hero -->
  <section class="mt-6 overflow-hidden rounded-3xl bg-gradient-to-br from-brand to-brand2 p-6 text-white shadow-card relative">
    <div class="absolute -right-8 -top-10 h-40 w-40 rounded-full bg-white/10"></div>
    <div class="absolute -right-2 top-16 h-24 w-24 rounded-full bg-white/10"></div>
    <div class="relative flex items-end justify-between">
      <div id="countdownBox">
        <!-- JSで描画 -->
      </div>
      <div class="rounded-2xl bg-white/15 px-4 py-3 text-center backdrop-blur-sm">
        <div class="text-[22px] leading-none">🔥</div>
        <div class="mt-1 font-num text-[20px] font-bold tnum" id="streakNum">0</div>
        <div class="text-[10px] text-white/80">連続日数</div>
      </div>
    </div>
    <div class="relative mt-5">
      <div class="flex items-center justify-between text-[11px] text-white/80">
        <span>全体の進捗</span><span class="font-num font-semibold" id="progPct">0%</span>
      </div>
      <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-white/20">
        <div class="h-full rounded-full bg-white transition-all" id="progBar" style="width:0%"></div>
      </div>
    </div>
  </section>

  <!-- today's task -->
  <section class="mt-6 lg:mt-6">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-[15px] font-bold">今日のタスク</h2>
      <span class="text-[12px] text-sub" id="taskCount">残り 0 / 0</span>
    </div>
    <div class="rounded-2xl bg-white p-2 shadow-soft border border-line" id="taskList"></div>
  </section>

  </div>
  <!-- /hero + today -->

  <!-- parts grid -->
  <section class="mt-6">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-[15px] font-bold">パート別対策</h2>
      <a href="parts/list.html" class="text-[12px] font-medium text-brand">すべて見る</a>
    </div>
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4" id="partGrid"></div>
  </section>

  <!-- grammar entry -->
  <section class="mt-6">
    <a href="grammar/list.html" class="flex items-center gap-4 rounded-2xl bg-gradient-to-br from-indigo-50 to-white p-4 shadow-soft border border-line">
      <div class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-white text-[24px] shadow-soft">🧩</div>
      <div class="flex-1">
        <p class="text-[15px] font-bold">中学文法 復習</p>
        <p class="text-[12px] text-sub">Part 5・6 に効く基礎を一歩ずつ</p>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </section>

  <!-- score trend + calendar (PCでは横並び) -->
  <div class="mt-6 grid gap-6 lg:grid-cols-2 lg:items-start">

  <!-- score trend -->
  <section>
    <div class="rounded-2xl bg-white p-5 shadow-soft border border-line">
      <div class="flex items-center justify-between">
        <h2 class="text-[15px] font-bold">推定スコア推移</h2>
        <span id="scoreDelta" class="hidden rounded-full px-2.5 py-1 text-[11px] font-bold"></span>
      </div>
      <div id="scoreBody"></div>
    </div>
  </section>

  <!-- study calendar -->
  <section>
    <div class="rounded-2xl bg-white p-5 shadow-soft border border-line">
      <div class="flex items-center justify-between">
        <h2 class="text-[15px] font-bold">学習カレンダー</h2>
        <span class="text-[12px] text-sub">直近2週間</span>
      </div>
      <div class="mt-4 flex justify-between gap-1" id="calendar"></div>
    </div>
  </section>

  </div>

</div>

<div id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/store.js?v=2"></script>
<script src="assets/content.js?v=6"></script>
<script src="assets/grammar.js?v=5"></script>
<script src="assets/ui.js?v=4"></script>
<script src="assets/firebase.js?v=2"></script>
<script src="assets/sync.js?v=2"></script>
<script>
  // ---- カウントダウン ----
  function renderCountdown() {
    const box = document.getElementById('countdownBox');
    const d = Store.daysUntilExam();
    if (d === null) {
      box.innerHTML = `
        <p class="text-[12px] font-medium text-white/80">試験日</p>
        <a href="settings.html" class="mt-1 inline-flex items-center gap-1 rounded-full bg-white/20 px-3 py-1.5 text-[13px] font-semibold">
          日付を設定する →
        </a>`;
    } else {
      const ex = Store.getExamDate();
      const dt = new Date(ex + 'T00:00:00');
      const w = ['日','月','火','水','木','金','土'][dt.getDay()];
      const label = d > 0 ? `${d}` : (d === 0 ? '今日' : '終了');
      const unit = d > 0 ? '日' : '';
      box.innerHTML = `
        <p class="text-[12px] font-medium text-white/80">試験日まで</p>
        <div class="mt-1 flex items-baseline gap-1.5">
          <span class="font-num text-[52px] font-extrabold leading-none tnum">${label}</span>
          <span class="pb-1 text-[15px] font-medium text-white/85">${unit}</span>
        </div>
        <p class="mt-1 text-[12px] text-white/70">${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日(${w})</p>`;
    }
  }

  // ---- 今日のタスク ----
  function todaysTasks() {
    // 日付ベースでパートをローテーション（毎日少しずつ変化）
    const order = ['part5','part1','part2','part6','part3','part7','part4'];
    const today = new Date();
    const di = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
    const a = order[di % order.length];
    // 文法トピックを日替わりで1つ
    const gorder = GRAMMAR.map((g) => g.id);
    const gid = gorder[di % gorder.length];
    const gram = getGrammar(gid);
    return [
      { id: 'shadowing', label: 'シャドーイング', sub: '英語→ポーズ→和訳を耳と口で', href: 'shadowing.html', badge: '🎙️' },
      { id: a, label: `Part ${getPart(a).no} ${getPart(a).title}`, sub: `${getPart(a).skill === 'L' ? 'リスニング' : 'リーディング'}`, href: `parts/part.html?p=${a}`, badge: getPart(a).no },
      { id: gid, label: `文法：${gram.title}`, sub: '中学文法 復習', href: `grammar/topic.html?g=${gid}`, badge: gram.icon },
    ];
  }

  function renderTasks() {
    const tasks = todaysTasks();
    const list = document.getElementById('taskList');
    let doneCount = 0;
    const rows = tasks.map((t, i) => {
      const done = Store.isDoneToday(t.id);
      if (done) doneCount++;
      const divider = i > 0 ? '<div class="mx-3 h-px bg-line"></div>' : '';
      if (done) {
        return divider + `<div class="flex items-center gap-3 rounded-xl px-3 py-3">
          <div class="grid h-9 w-9 place-items-center rounded-full bg-emerald-500 text-white">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="flex-1"><p class="text-[14px] font-medium text-sub line-through">${t.label}</p></div>
          <span class="text-[12px] font-semibold text-emerald-600">完了</span>
        </div>`;
      }
      return divider + `<a href="${t.href}" class="flex items-center gap-3 rounded-xl px-3 py-3">
        <div class="grid h-9 w-9 place-items-center rounded-full bg-indigo-50 text-brand font-num font-bold text-[13px]">${t.badge}</div>
        <div class="flex-1">
          <p class="text-[14px] font-semibold">${t.label}</p>
          <p class="text-[11px] text-sub">${t.sub}</p>
        </div>
        <span class="rounded-full bg-brand px-4 py-2 text-[12px] font-bold text-white shadow-soft">はじめる</span>
      </a>`;
    }).join('');
    list.innerHTML = rows;
    document.getElementById('taskCount').textContent = `残り ${tasks.length - doneCount} / ${tasks.length}`;
  }

  // ---- パートカード ----
  function renderParts() {
    const grid = document.getElementById('partGrid');
    const show = PARTS.filter((p) => [1,2,5,7].includes(p.no)); // 代表4つ
    grid.innerHTML = show.map((p) => {
      const pr = Store.getPartProgress(p.id);
      const bankLen = PART_CONTENT[p.id]?.questions.length || 0;
      const total = pr.total || Math.min(PART_SESSION, bankLen);
      const completed = pr.completed;
      const pct = total ? Math.round((completed / total) * 100) : 0;
      const isL = p.skill === 'L';
      const tag = isL ? 'bg-sky-50 text-sky-600' : 'bg-violet-50 text-violet-600';
      const bar = isL ? 'bg-sky-500' : 'bg-violet-500';
      return `<a href="parts/part.html?p=${p.id}" class="rounded-2xl bg-white p-4 shadow-soft border border-line">
        <div class="flex items-center justify-between">
          <span class="rounded-lg ${tag} px-2 py-0.5 text-[10px] font-bold">${p.skill}</span>
          <span class="font-num text-[11px] font-semibold text-sub tnum">${completed}/${total}</span>
        </div>
        <p class="mt-3 text-[14px] font-bold">Part ${p.no}</p>
        <p class="text-[11px] text-sub">${p.title}</p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-line">
          <div class="h-full rounded-full ${bar}" style="width:${pct}%"></div>
        </div>
      </a>`;
    }).join('');
  }

  // ---- 学習カレンダー（直近14日）----
  function renderCalendar() {
    const cal = document.getElementById('calendar');
    const studied = new Set(Store.get().studyDates);
    const wd = ['日','月','火','水','木','金','土'];
    let html = '';
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = Store.ymd(d);
      const on = studied.has(key);
      const isToday = i === 0;
      html += `<div class="flex flex-col items-center gap-1">
        <div class="h-7 w-7 rounded-lg ${on ? 'bg-brand' : 'bg-line'} ${isToday && !on ? 'ring-2 ring-brand/40' : ''} grid place-items-center">
          ${on ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
        </div>
        <span class="text-[9px] text-sub">${i % 2 === 0 ? (d.getMonth()+1)+'/'+d.getDate() : ''}</span>
      </div>`;
    }
    cal.innerHTML = html;
  }

  // ---- 推定スコア推移 ----
  function renderScore() {
    const log = Store.getScoreLog();
    const body = document.getElementById('scoreBody');
    const delta = document.getElementById('scoreDelta');
    if (log.length < 2) {
      delta.classList.add('hidden');
      const latest = Store.latestScore();
      body.innerHTML = latest
        ? `<div class="mt-2 flex items-baseline gap-1"><span class="font-num text-[40px] font-extrabold tnum">${latest}</span><span class="text-[13px] text-sub">点（目安）</span></div>
           <p class="mt-1 text-[12px] text-sub">もう一度学習すると、推移グラフが表示されます 📈</p>`
        : `<p class="mt-3 text-[13px] text-sub leading-relaxed">問題を解くと、正答率から<strong class="text-ink">推定スコア</strong>を記録して、伸びをグラフで見せます 📈<br>まずは「今日のタスク」から始めましょう！</p>`;
      return;
    }
    const pts = log.slice(-12);
    const W = 320, H = 110, pad = 8, min = 100, max = 900;
    const x = (i) => (pts.length === 1 ? W : (i / (pts.length - 1)) * W);
    const y = (s) => H - ((Math.max(min, Math.min(max, s)) - min) / (max - min)) * (H - pad * 2) - pad;
    const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(' ');
    const area = `${line} L${W},${H} L0,${H} Z`;
    const last = pts[pts.length - 1].score, first = pts[0].score, d = last - first;
    delta.textContent = (d >= 0 ? '+' : '') + d + (d >= 0 ? ' ↑' : ' ↓');
    delta.className = 'rounded-full px-2.5 py-1 text-[11px] font-bold ' +
      (d >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-500');
    delta.classList.remove('hidden');
    body.innerHTML = `
      <div class="mt-1 flex items-baseline gap-1">
        <span class="font-num text-[34px] font-extrabold tnum">${last}</span>
        <span class="text-[13px] text-sub">点（目安）</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" class="mt-2 w-full">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#sg)"/>
        <path d="${line}" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" fill="#4F46E5"/>
      </svg>
      <p class="text-[10px] text-sub">直近 ${pts.length} 回の学習</p>`;
  }

  function render() {
    document.getElementById('streakNum').textContent = Store.getStreak();
    const pct = Store.overallProgress(PARTS.map((p) => p.id));
    document.getElementById('progPct').textContent = pct + '%';
    document.getElementById('progBar').style.width = pct + '%';
    renderCountdown();
    renderTasks();
    renderParts();
    renderScore();
    renderCalendar();
  }

  document.getElementById('nav').innerHTML = UI.renderNav('home');
  render();
  // 他ページから戻ったとき最新化
  window.addEventListener('pageshow', render);
  // クラウドからデータが届いたら再描画
  Store.onChange(render);
</script>
</body>
</html>
