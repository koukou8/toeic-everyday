<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>シャドーイング — まいにちTOEIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body{-webkit-font-smoothing:antialiased} .tnum{font-variant-numeric:tabular-nums}
  input[type=range]{accent-color:#5b5bd6}
</style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans lg:pl-60">

<div class="mx-auto max-w-[440px] lg:max-w-[560px] min-h-screen px-5 pb-28 lg:pb-12 pt-7">

  <header class="flex items-center gap-3">
    <a href="index.html" class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[12px] text-sub">英語 → あなたの番 → 和訳 を自動でくり返し</p>
      <h1 class="text-[20px] font-bold tracking-tight">シャドーイング</h1>
    </div>
    <span class="font-num text-[13px] font-semibold text-sub tnum" id="counter">0 / 0</span>
  </header>

  <!-- レッスンタブ -->
  <div id="lessonTabs" class="mt-5 grid grid-cols-3 gap-2"></div>

  <!-- 学習カード -->
  <div class="mt-5 rounded-3xl bg-white p-5 shadow-card border border-line">
    <!-- フェーズ表示 -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="phaseDot" class="h-3 w-3 rounded-full bg-slate-300"></span>
        <span id="phaseLabel" class="text-[13px] font-bold text-sub">停止中</span>
      </div>
      <span id="rptState" class="text-[11px] font-semibold text-sub"></span>
    </div>

    <!-- 英文 -->
    <div id="enBox" class="mt-4 rounded-2xl border border-line bg-slate-50 px-4 py-4 transition">
      <p class="text-[11px] font-semibold text-sub mb-1">English</p>
      <p id="enText" class="text-[18px] font-bold leading-snug">—</p>
    </div>
    <!-- 和訳 -->
    <div id="jaBox" class="mt-3 rounded-2xl border border-line bg-slate-50 px-4 py-4 transition">
      <p class="text-[11px] font-semibold text-sub mb-1">日本語訳</p>
      <p id="jaText" class="text-[16px] font-medium leading-snug text-sub">—</p>
    </div>
  </div>

  <!-- 再生コントロール -->
  <div class="mt-6 flex items-center justify-center gap-6">
    <button id="prevBtn" class="grid h-12 w-12 place-items-center rounded-full bg-white shadow-soft border border-line text-sub active:scale-95 transition" aria-label="前へ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button id="playBtn" class="grid h-20 w-20 place-items-center rounded-full bg-brand text-white shadow-card active:scale-95 transition" aria-label="再生／停止">
      <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="stopIcon" class="hidden" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button id="nextBtn" class="grid h-12 w-12 place-items-center rounded-full bg-white shadow-soft border border-line text-sub active:scale-95 transition" aria-label="次へ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2.5 6L5 6v12z"/></svg>
    </button>
  </div>

  <!-- リピート / 速度 -->
  <div class="mt-6 rounded-2xl bg-white p-4 shadow-soft border border-line">
    <button id="repeatBtn" class="flex w-full items-center justify-between rounded-xl px-2 py-2">
      <span class="flex items-center gap-2 text-[14px] font-semibold">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        リピート再生
      </span>
      <span id="repeatPill" class="rounded-full px-3 py-1 text-[12px] font-bold">ON</span>
    </button>

    <div class="mx-2 my-2 h-px bg-line"></div>

    <div class="px-2 py-1">
      <div class="flex items-center justify-between">
        <span class="text-[14px] font-semibold">英語の速さ</span>
        <span id="rateVal" class="font-num text-[13px] font-bold text-brand tnum">0.90x</span>
      </div>
      <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.9" class="mt-2 w-full" />
      <div class="mt-1 flex justify-between text-[10px] text-sub"><span>ゆっくり</span><span>速い</span></div>
    </div>
  </div>

  <p class="mt-4 text-center text-[11px] text-sub leading-relaxed">
    🚗 運転前にレッスンと速さを選び、▶ をタップしてから発進しましょう。<br>再生中は画面操作なしで「聞く → 真似して声に出す → 意味を確認」が続きます。
  </p>

</div>

<div id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/store.js?v=2"></script>
<script src="assets/content.js?v=5"></script>
<script src="assets/ui.js?v=4"></script>
<script src="assets/firebase.js?v=2"></script>
<script src="assets/sync.js?v=2"></script>
<script>
  // ===== シャドーイング自動ループ再生 =====
  const PAUSE_RATIO = 1.4, PAUSE_MIN = 1.5, GAP = 0.4;
  const supported = 'speechSynthesis' in window;

  const state = {
    lessonIdx: 0,
    itemIdx: 0,
    phase: 'idle', // 'en' | 'pause' | 'ja' | 'idle'
    playing: false,
    rate: 0.9,
    repeat: true,
    gen: 0,      // 世代トークン（停止・移動で古いコールバックを無効化）
    timer: null,
  };

  const els = {
    tabs: document.getElementById('lessonTabs'),
    counter: document.getElementById('counter'),
    phaseDot: document.getElementById('phaseDot'),
    phaseLabel: document.getElementById('phaseLabel'),
    enBox: document.getElementById('enBox'), enText: document.getElementById('enText'),
    jaBox: document.getElementById('jaBox'), jaText: document.getElementById('jaText'),
    playIcon: document.getElementById('playIcon'), stopIcon: document.getElementById('stopIcon'),
    repeatPill: document.getElementById('repeatPill'), rptState: document.getElementById('rptState'),
    rate: document.getElementById('rate'), rateVal: document.getElementById('rateVal'),
  };

  const lesson = () => SHADOWING[state.lessonIdx];
  const items = () => lesson().items;
  const item = () => items()[state.itemIdx];

  // ---- 音声選択（言語コード先頭一致）----
  function pickVoice(lang) {
    if (!supported) return null;
    const vs = window.speechSynthesis.getVoices();
    const l = lang.toLowerCase(), pre = l.split('-')[0];
    return vs.find((v) => v.lang.toLowerCase() === l)
        || vs.find((v) => v.lang.toLowerCase().startsWith(pre)) || null;
  }
  if (supported) window.speechSynthesis.getVoices();

  // ---- ポーズ秒（語数と速度から算出）----
  function computePause(en, rate) {
    const words = Math.max(1, en.trim().split(/\s+/).length);
    return Math.max(PAUSE_MIN, words * 0.35 * (1 / rate) * PAUSE_RATIO * 0.5 + 1);
  }

  // ---- 1発話（onend / onerror / ウォッチドッグのいずれかで完了）----
  function speakStep(text, lang, rate, gen, done) {
    if (!supported) { state.timer = setTimeout(() => { if (gen === state.gen && state.playing) done(); }, 1200); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate; u.pitch = 1;
    const v = pickVoice(lang); if (v) u.voice = v;
    let settled = false;
    const finish = () => {
      if (settled || gen !== state.gen || !state.playing) return;
      settled = true; clearTimeout(wd); done();
    };
    u.onend = finish; u.onerror = finish;
    const words = Math.max(1, text.trim().split(/\s+/).length);
    const wd = setTimeout(finish, ((words * 0.7) / rate + 6) * 1000); // 安全網
    state.timer = wd;
    window.speechSynthesis.speak(u);
  }

  function delay(sec, gen, fn) {
    if (gen !== state.gen || !state.playing) return;
    state.timer = setTimeout(() => { if (gen === state.gen && state.playing) fn(); }, sec * 1000);
  }

  function setPhase(p) { state.phase = p; }

  // ---- 1項目の再生フロー（英語 → 間 → ポーズ → 和訳 → 次）----
  function runItem(gen) {
    if (gen !== state.gen || !state.playing) return;
    const cur = item();
    setPhase('en'); render();
    speakStep(cur.en, 'en-US', state.rate, gen, () => {
      delay(GAP, gen, () => {
        setPhase('pause'); render();
        delay(computePause(cur.en, state.rate), gen, () => {
          setPhase('ja'); render();
          speakStep(cur.ja, 'ja-JP', 1.0, gen, () => {
            delay(GAP, gen, () => advance(gen));
          });
        });
      });
    });
  }

  function advance(gen) {
    if (gen !== state.gen || !state.playing) return;
    if (state.itemIdx < items().length - 1) {
      state.itemIdx++; render(); runItem(gen);
    } else {
      Store.recordDone('shadowing');
      if (state.repeat) { state.itemIdx = 0; render(); runItem(gen); }
      else { stop(); }
    }
  }

  function play() {
    if (state.playing) return;
    if (!supported) alert('お使いのブラウザは音声読み上げに対応していません。Chrome / Safari をお試しください。');
    state.playing = true; state.gen++;
    runItem(state.gen); render();
  }
  function stop() {
    state.playing = false; state.gen++;
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    if (supported) window.speechSynthesis.cancel();
    setPhase('idle'); render();
  }
  function restartIfPlaying() {
    if (!state.playing) return;
    state.gen++;
    if (state.timer) { clearTimeout(state.timer); state.timer = null; }
    if (supported) window.speechSynthesis.cancel();
    runItem(state.gen);
  }

  function jump(delta) {
    const len = items().length;
    state.itemIdx = (state.itemIdx + delta + len) % len;
    render();
    restartIfPlaying();
  }

  function selectLesson(i) {
    if (i === state.lessonIdx) return;
    stop();
    state.lessonIdx = i; state.itemIdx = 0; render();
  }

  // ---- 描画 ----
  const PHASES = {
    en:    { label: '英語', dot: 'bg-teal-400' },
    pause: { label: 'あなたの番（声に出そう）', dot: 'bg-amber-400' },
    ja:    { label: '日本語訳', dot: 'bg-violet-400' },
    idle:  { label: '停止中', dot: 'bg-slate-300' },
  };

  function renderTabs() {
    els.tabs.innerHTML = SHADOWING.map((l, i) => {
      const on = i === state.lessonIdx;
      return `<button data-lesson="${i}" class="rounded-xl px-2 py-2.5 text-center border transition ${on ? 'border-brand bg-indigo-50 text-brand' : 'border-line bg-white text-sub'}">
        <span class="block text-[12px] font-bold">${l.title}</span>
        <span class="block text-[10px] ${on ? 'text-brand/70' : 'text-sub'}">${l.desc}</span>
      </button>`;
    }).join('');
    els.tabs.querySelectorAll('[data-lesson]').forEach((b) =>
      b.addEventListener('click', () => selectLesson(+b.dataset.lesson)));
  }

  function render() {
    const cur = item();
    const ph = PHASES[state.phase];
    els.phaseDot.className = 'h-3 w-3 rounded-full ' + ph.dot;
    els.phaseLabel.textContent = ph.label;
    els.enText.textContent = cur.en;
    els.jaText.textContent = cur.ja;
    els.counter.textContent = (state.itemIdx + 1) + ' / ' + items().length;

    // アクティブなフェーズの枠をハイライト
    const enActive = state.phase === 'en' || state.phase === 'pause';
    const jaActive = state.phase === 'ja';
    els.enBox.className = 'mt-4 rounded-2xl border px-4 py-4 transition ' +
      (enActive ? 'border-teal-300 bg-teal-50 ring-2 ring-teal-200' : 'border-line bg-slate-50');
    els.jaBox.className = 'mt-3 rounded-2xl border px-4 py-4 transition ' +
      (jaActive ? 'border-violet-300 bg-violet-50 ring-2 ring-violet-200' : 'border-line bg-slate-50');

    // 再生ボタン
    els.playIcon.classList.toggle('hidden', state.playing);
    els.stopIcon.classList.toggle('hidden', !state.playing);

    // リピート
    els.repeatPill.textContent = state.repeat ? 'ON' : 'OFF';
    els.repeatPill.className = 'rounded-full px-3 py-1 text-[12px] font-bold ' +
      (state.repeat ? 'bg-brand text-white' : 'bg-slate-100 text-sub');
    els.rptState.textContent = state.repeat ? '🔁 くり返し' : '';

    // タブのアクティブ表示を更新
    els.tabs.querySelectorAll('[data-lesson]').forEach((b) => {
      const on = +b.dataset.lesson === state.lessonIdx;
      b.className = 'rounded-xl px-2 py-2.5 text-center border transition ' +
        (on ? 'border-brand bg-indigo-50 text-brand' : 'border-line bg-white text-sub');
    });
  }

  // ---- イベント ----
  document.getElementById('playBtn').addEventListener('click', () => state.playing ? stop() : play());
  document.getElementById('prevBtn').addEventListener('click', () => jump(-1));
  document.getElementById('nextBtn').addEventListener('click', () => jump(1));
  document.getElementById('repeatBtn').addEventListener('click', () => { state.repeat = !state.repeat; render(); });
  els.rate.addEventListener('input', () => {
    state.rate = +els.rate.value;
    els.rateVal.textContent = state.rate.toFixed(2) + 'x';
  });
  // 画面を離れる/隠れるときは停止
  window.addEventListener('pagehide', stop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });

  renderTabs();
  render();
  document.getElementById('nav').innerHTML = UI.renderNav('shadowing');
</script>
</body>
</html>
