<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中学文法 復習 — まいにちTOEIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tw.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style> body{-webkit-font-smoothing:antialiased} .tnum{font-variant-numeric:tabular-nums} </style>
</head>
<body class="bg-[#F6F7F9] text-ink font-sans lg:pl-60">

<div class="mx-auto max-w-[440px] lg:max-w-[880px] min-h-screen px-5 pb-28 lg:pb-12 pt-7">

  <header class="flex items-center gap-3">
    <a href="../index.html" class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-soft border border-line text-sub">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-[20px] font-bold tracking-tight">中学文法 復習</h1>
  </header>

  <p class="mt-3 text-[13px] text-sub leading-relaxed">TOEIC の土台になる基礎文法を、<strong class="text-ink">効く順</strong>に並べました。上から一歩ずつ。Part 5・6 の点が伸びます。</p>

  <section class="mt-5 grid gap-3 lg:grid-cols-2" id="topics"></section>

</div>

<div id="nav"></div>

<script src="../assets/store.js?v=2"></script>
<script src="../assets/grammar.js?v=5"></script>
<script src="../assets/ui.js?v=3"></script>
<script>
  function card(g) {
    const pr = Store.getPartProgress(g.id);
    const total = g.questions.length;
    const pct = total ? Math.round((pr.completed / total) * 100) : 0;
    const done = pct >= 100;
    return `<a href="topic.html?g=${g.id}" class="flex items-center gap-4 rounded-2xl bg-white p-4 shadow-soft border border-line">
      <div class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-indigo-50 text-[22px]">${g.icon}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <p class="text-[15px] font-bold truncate">${g.title}</p>
          ${done
            ? '<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-bold text-emerald-600">達成</span>'
            : `<span class="rounded-full bg-amber-50 px-2 py-0.5 text-[10px] font-bold text-amber-600">${g.tag}</span>`}
        </div>
        <p class="text-[12px] text-sub">${g.desc}</p>
        <div class="mt-2 flex items-center gap-2">
          <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-line">
            <div class="h-full rounded-full bg-brand" style="width:${pct}%"></div>
          </div>
          <span class="font-num text-[11px] font-semibold text-sub tnum">${pr.completed}/${total}</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>`;
  }

  function render() {
    document.getElementById('topics').innerHTML = GRAMMAR.map(card).join('');
  }
  render();
  Store.onChange(render);
  document.getElementById('nav').innerHTML = UI.renderNav('grammar', '../');
</script>
</body>
</html>
